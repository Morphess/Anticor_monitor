{% extends "base.html" %}
{% block title %}Програми — координатор{% endblock %}
{% block role_name %}Координатор програми{% endblock %}
{% block content %}
<section class="unit">
  <div>
    <p class="label">Назва підрозділу</p>
    <h1 id="unit-name">—</h1>
  </div>
  <button class="btn btn-dark" type="button" id="create-program">Створити програму</button>
</section>
<div class="toolbar">
  <label class="field" style="flex:1">Пошук
    <input id="search" type="search" placeholder="Програма, розділ, захід або підрозділ">
  </label>
  <label class="field">Звітний період
    <select id="period"></select>
  </label>
</div>
<div id="programs"><p class="muted">Завантаження…</p></div>

<dialog id="program-dialog">
  <form method="dialog" id="program-form">
    <h2 style="margin-top:0">Нова програма</h2>
    <div class="form-grid">
      <label class="field">Код програми<input name="id" required maxlength="50" placeholder="AKP-2026-2027"></label>
      <label class="field">Організація<input name="organization_name" required></label>
      <label class="field">Дата початку<input name="start_date" type="date" required></label>
      <label class="field">Дата завершення<input name="end_date" type="date" required></label>
      <label class="field">Реквізити затвердження<input name="approval_reference" required></label>
      <label class="field">Стан затвердження
        <select name="approval_status"><option value="draft">Проєкт</option><option value="approved">Затверджено</option></select>
      </label>
    </div>
    <label class="field" style="margin-bottom:12px">Назва<input name="title" required></label>
    <label class="field" style="margin-bottom:12px">Мета<textarea name="goals" rows="3" required></textarea></label>
    <div id="program-error" class="alert hidden" role="alert"></div>
    <div class="toolbar" style="margin:0">
      <button class="btn btn-dark" type="submit" value="save">Створити програму</button>
      <button class="btn" type="button" id="program-cancel">Скасувати</button>
    </div>
  </form>
</dialog>
{% endblock %}
{% block scripts %}<script src="/static/js/coordinator.js"></script>{% endblock %}
