<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Програми підрозділу — координатор</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/monitor.css') }}">
</head>
<body class="page-coordinator">
<div class="demo-banner" role="note">ДЕМО-ЗАГЛУШКА · дані синтетичні, зміни лише в браузері; не є робочою системою</div>
<header class="top"><b>Антикорупційна програма</b><div><span>Координатор програми · демо</span><a href="/executor">Кабінет виконавця</a><a href="/login">Вийти</a></div></header>
<main>
  <section class="unit"><div><p>Назва підрозділу</p><h1>{{ unit }}</h1></div></section>
  <div class="bar">
    <button class="create" type="button" title="Доступно після підключення бекенду" onclick="alert('Дія доступна після підключення бекенду')">Створити програму</button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr">Пошук програми</span>
      <input id="q" placeholder="Пошук програми за назвою або роком" autocomplete="off">
    </label>
  </div>
  <div class="list">
    <div class="row head"><span>Назва програми</span><span class="d">Дата початку</span><span class="d">Дата кінця</span><span class="r">Скільки виконано</span></div>
    <div id="programs"></div>
    <p class="empty" id="empty" hidden></p>
  </div>
</main>
<script id="programs-data" type="application/json">{{ programs | tojson }}</script>
<script id="statuses-data" type="application/json">{{ statuses | tojson }}</script>
<script src="{{ url_for('static', path='js/coordinator.js') }}"></script>
</body>
</html>
