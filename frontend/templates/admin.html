<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Користувачі — адміністратор</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/monitor.css') }}">
</head>
<body class="page-admin">
<header class="top"><b>Антикорупційна програма</b><div><span>Адміністратор</span><a href="/coordinator">Програми</a><a href="/login" data-logout>Вийти</a></div></header>
<main>
  <section class="unit"><div><p>Назва підрозділу</p><h1 id="unit">Завантаження…</h1></div></section>
  <div class="bar">
    <button class="create" type="button" id="create" aria-expanded="false" aria-controls="user-form">Створити користувача</button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr">Пошук користувача</span>
      <input id="q" placeholder="Пошук за логіном, підрозділом, посадою або роллю" autocomplete="off">
    </label>
  </div>

  <form class="user-form" id="user-form" hidden novalidate>
    <h2>Новий користувач</h2>
    <div class="fields">
      <label>Логін<input name="login" autocomplete="off" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="new-password" required>
        <span class="muted">Щонайменше 12 символів</span></label>
      <label>Роль<select name="role_id" id="f-role"></select></label>
      <label>Підрозділ<select name="department_id" id="f-department"></select></label>
      <label>Посада<input name="position" autocomplete="off"></label>
      <label>Програма<select name="program_id" id="f-program"></select></label>
    </div>
    <p class="error-line" id="form-error" role="alert"></p>
    <div class="form-actions">
      <button class="btn-plain" type="button" id="cancel">Скасувати</button>
      <button class="create" type="submit">Створити</button>
    </div>
  </form>

  <p class="ok" id="saved" role="status"></p>
  <div class="list">
    <div class="row users-row head"><span>Логін</span><span>Підрозділ</span><span>Посада</span><span>Роль</span></div>
    <div id="users"></div>
    <p class="empty" id="empty" hidden></p>
  </div>
  <p class="error-line" id="page-error" role="alert"></p>
</main>
<script src="{{ url_for('static', path='js/api.js') }}"></script>
<script src="{{ url_for('static', path='js/admin.js') }}"></script>
</body>
</html>
