<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналітика програм — аналітик</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/monitor.css') }}">
</head>
<body class="page-coordinator page-analyst">

<main>
  <section class="unit">

  <div class="tabs" role="tablist" aria-label="Розділи кабінету">

{% include "_analytics.html" %}
{% include "_programs.html" %}

  <p class="error-line" id="page-error" role="alert"></p>
  <div class="tip" id="tip" role="tooltip" hidden></div>
</main>
<script src="{{ url_for('static', path='js/api.js') }}"></script>
<script src="{{ url_for('static', path='js/coordinator.js') }}"></script>
