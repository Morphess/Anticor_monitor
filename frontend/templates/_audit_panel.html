  <section id="panel-audit" role="tabpanel" aria-labelledby="tab-audit" data-panel="audit" class="hidden">
    <div class="toolbar admin-toolbar audit-toolbar">
      <label class="field grow">Пошук
        <input id="audit-search" type="search" autocomplete="off" maxlength="100"
               placeholder="Логін, посада, підрозділ, об'єкт, поле або значення">
      </label>
      <label class="field">Користувач
        <select id="audit-user"><option value="">Усі користувачі</option></select>
      </label>
      <label class="field">Підрозділ
        <select id="audit-dept"><option value="">Усі підрозділи</option><option value="-">Без підрозділу / система</option></select>
      </label>
      <label class="field">Дія
        <select id="audit-action"><option value="">Усі дії</option></select>
      </label>
      <label class="field">Об'єкт
        <select id="audit-entity"><option value="">Усі об'єкти</option></select>
      </label>
      <label class="field">З дати
        <input id="audit-from" type="date">
      </label>
      <label class="field">По дату
        <input id="audit-to" type="date">
      </label>
      <button class="btn" type="button" id="audit-reset">Скинути фільтри</button>
    </div>
    <div class="admin-list-head">
      <span id="audit-count" role="status" aria-live="polite">Відкрийте вкладку, щоб завантажити журнал…</span>
      <div class="pager pager-top" id="audit-pager-top"></div>
    </div>
    <div class="table-wrap admin-table-wrap">
      <table class="grid admin-table audit-table" aria-label="Журнал дій користувачів">
        <thead><tr>
          <th scope="col">Дата і час</th><th scope="col">Користувач</th><th scope="col">Підрозділ</th>
          <th scope="col">Дія</th><th scope="col">Об'єкт</th><th scope="col">Що змінено</th>
        </tr></thead>
        <tbody id="audit-rows"><tr><td colspan="6" class="muted">Завантаження…</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="audit-pager"></div>
    <p class="muted small">Тут відображаються події, які записав бекенд. Підрозділ і роль показано за поточним обліковим записом. Значення полів паролів і токенів приховуються.</p>
  </section>
