name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository files
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          if [ -n "$(git ls-files -- .env ':(glob)**/.env')" ]; then
            echo "Remove tracked .env files from the repository."
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ac_test"
          --health-interval 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests on PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ac_test
        run: python -m pytest -q
