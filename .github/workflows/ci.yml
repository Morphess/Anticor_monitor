name: CI

on:
  pull_request:
    branches: [main, backend, demid]
  push:
    branches: [main, backend, demid]

env:
  APP_NAME: BorderGroup CI
  DEBUG: "false"
  SQL_ECHO: "false"
  DATABASE_URL: postgresql+psycopg://ci_user:ci_test_only@127.0.0.1:5432/bordergroup_ci
  JWT_SECRET_KEY: synthetic-ci-only-hs256-key-at-least-32-bytes

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: bordergroup_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d bordergroup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository files
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          if [ -n "$(git ls-files -- .env ':(glob)**/.env')" ]; then
            echo "Remove tracked .env files from the repository."
            exit 1
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx2==2.16.2
          python -m pip check

      - name: Check Alembic migration
        env:
          DATABASE_URL: "postgresql+psycopg://ci_user:ci_test_only@127.0.0.1:5432/bordergroup_ci"
          PYTHONPATH: backend
        run: |
          alembic upgrade 842c9b19e77c
          alembic upgrade head
          alembic current --check-heads
          alembic check
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)

          if inspector.has_table("auth_users"):
              raise SystemExit("Obsolete auth_users table still exists")

          if not inspector.has_table("users"):
              raise SystemExit("users table is missing")

          indexes = inspector.get_indexes("users")
          if not any(
              index["name"] == "ix_users_login" and index["unique"]
              for index in indexes
          ):
              raise SystemExit("Unique users login index is missing")

          engine.dispose()
          print("Migration OK")
          PY

      - name: Run Python tests
        env:
          PYTHONPATH: backend
          DEPARTMENT_TEST_DATABASE_URL: "postgresql+psycopg://ci_user:ci_test_only@127.0.0.1:5432/bordergroup_ci"
          ORDER_TEST_DATABASE_URL: "postgresql+psycopg://ci_user:ci_test_only@127.0.0.1:5432/bordergroup_ci"
        run: python -m unittest discover -s tests -v
