name: Playwright E2E
on:
  pull_request:
    branches: [backend, main]
  push:
    branches: [backend, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run isolated Chromium workflow
        run: bash scripts/test-e2e.sh
      - name: Upload Playwright report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore
