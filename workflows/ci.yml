name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository files
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          if [ -n "$(git ls-files -- .env ':(glob)**/.env')" ]; then
            echo "Remove tracked .env files from the repository."
            exit 1
          fi
