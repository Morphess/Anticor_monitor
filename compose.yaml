name: bordergroup

services:
  db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the application user in .env}
      APP_NAME: ${APP_NAME:-BorderGroup}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://127.0.0.1:8001","http://localhost:8001"]}'
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-768}
      DEBUG: ${DEBUG:-false}
      SQL_ECHO: ${SQL_ECHO:-false}
      ORDER_DOCUMENTS_DIR: /app/storage/orders
      REPORT_EXPORT_DIR: /app/storage/reports
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    volumes:
      - order_documents:/app/storage/orders
      - report_exports:/app/storage/reports
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  order_documents:
  report_exports:
